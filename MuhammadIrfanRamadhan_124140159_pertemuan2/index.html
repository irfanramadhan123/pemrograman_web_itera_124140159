<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student Productivity Dashboard - kelola tugas kuliah dan pantau progres. Praktikum PAW Pertemuan 2 (ES6+)." />
  <title>Student Productivity Dashboard | PAW Pertemuan 2</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten utama</a>

  <header class="app-header">
    <div class="container header-inner">
      <div class="identity-block">
        <h1 class="visually-hidden">Student Productivity Dashboard</h1>
        <p class="identity-name">Muhammad Irfan Ramadhan</p>
        <p class="identity-nim">NIM 124140159</p>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <!-- Ringkasan statistik (angka diisi JS, bukan statis) -->
    <section aria-labelledby="statsTitle" class="stats-section">
      <h2 id="statsTitle">Ringkasan</h2>
      <div class="stats-grid">
        <article class="stat-card">
          <h3>Seluruh tugas</h3>
          <p class="stat-number" id="statTotal">0</p>
        </article>
        <article class="stat-card">
          <h3>Belum selesai</h3>
          <p class="stat-number" id="statActive">0</p>
        </article>
        <article class="stat-card">
          <h3>Sudah selesai</h3>
          <p class="stat-number" id="statDone">0</p>
        </article>
        <article class="stat-card stat-danger">
          <h3>Terlambat</h3>
          <p class="stat-number" id="statOverdue">0</p>
        </article>
      </div>
    </section>

    <!-- Pencarian & filter -->
    <section aria-labelledby="controlsTitle" class="controls-section">
      <h2 id="controlsTitle">Pencarian &amp; Filter</h2>
      <div class="controls-grid">
        <div class="field">
          <label for="searchInput">Cari tugas / mata kuliah</label>
          <input type="search" id="searchInput" placeholder="cth: PAW atau Laporan…" autocomplete="off" />
        </div>
        <div class="field">
          <label for="statusFilter">Status penyelesaian</label>
          <select id="statusFilter">
            <option value="all">Semua</option>
            <option value="active">Belum selesai</option>
            <option value="done">Sudah selesai</option>
          </select>
        </div>
        <div class="field">
          <label for="deadlineFilter">Status tenggat</label>
          <select id="deadlineFilter">
            <option value="all">Semua tenggat</option>
            <option value="overdue">Terlambat saja</option>
            <option value="upcoming">Belum terlambat</option>
          </select>
        </div>
      </div>
      <p id="resultInfo" class="result-info" aria-live="polite"></p>
    </section>

    <!-- Form tambah / edit -->
    <section aria-labelledby="formTitle" class="form-section">
      <h2 id="formTitle">Tambah Tugas</h2>
      <form id="taskForm" novalidate>
        <input type="hidden" id="taskId" value="" />
        <div class="form-grid">
          <div class="field">
            <label for="taskTitle">Nama tugas <span aria-hidden="true">*</span></label>
            <input type="text" id="taskTitle" maxlength="120" placeholder="cth: Laporan Praktikum 2" required />
            <small class="error" id="errTitle" hidden></small>
          </div>
          <div class="field">
            <label for="taskCourse">Mata kuliah <span aria-hidden="true">*</span></label>
            <input type="text" id="taskCourse" maxlength="80" placeholder="cth: PAW" required />
            <small class="error" id="errCourse" hidden></small>
          </div>
          <div class="field">
            <label for="taskDeadline">Tenggat waktu <span aria-hidden="true">*</span></label>
            <input type="date" id="taskDeadline" required />
            <small class="error" id="errDeadline" hidden></small>
          </div>
          <div class="field field-full">
            <label for="taskDesc">Deskripsi / catatan (opsional)</label>
            <textarea id="taskDesc" rows="2" maxlength="500" placeholder="cth: Bab 1–3, kumpulkan PDF di LMS"></textarea>
          </div>
        </div>
        <p id="formMessage" class="form-message" role="status" aria-live="polite" hidden></p>
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">Simpan tugas</button>
          <button type="button" id="cancelEditBtn" class="btn" hidden>Batal edit</button>
          <button type="button" id="resetDataBtn" class="btn btn-ghost" title="Kembalikan ke data contoh awal">Reset data contoh</button>
        </div>
      </form>
    </section>

    <!-- Daftar tugas -->
    <section aria-labelledby="listTitle" class="list-section">
      <h2 id="listTitle">Daftar Tugas</h2>
      <p id="emptyState" class="empty-state" hidden>Tidak ada tugas yang cocok. Coba ubah kata kunci atau filter.</p>
      <ul id="taskList" class="task-list"></ul>
    </section>
  </main>

  <!-- Entry point ES Module (wajib type="module" agar import/export jalan) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
